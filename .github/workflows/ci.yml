name: Backend CI

on:
  push:
    branches: [ main, develop, sprint/** ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SPRINT_MODULES: co-shared-kernel,co-identity/co-identity-domain,co-identity/co-identity-application

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Clean local maven cache
        run: rm -rf ~/.m2/repository/com/campusoverflow

      - name: Stage1 Compile all needed modules
        run: mvn -B -f backend/pom.xml clean compile -pl "${{ env.SPRINT_MODULES }},co-bootstrap" -am

      - name: Stage2 Run unit tests for Sprint0 modules
        run: mvn -B -f backend/pom.xml test -pl "${{ env.SPRINT_MODULES }}" -am

      - name: Stage3 Run ArchitectureTest ONLY in co-bootstrap
        run: mvn -B -f backend/pom.xml test -pl co-bootstrap -am -Dtest=ArchitectureTest -Dsurefire.failIfNoSpecifiedTests=false -e

      - name: Stage4 Coverage report
        run: mvn -B -f backend/pom.xml verify -DskipITs -Djacoco.skip=false -pl "${{ env.SPRINT_MODULES }}" -am
