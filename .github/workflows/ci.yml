# CampusOverflow 持续集成流水线 (对应 adr42 第10章适应度函数与第7章部署视图)
name: CI

on:
  push:
    branches: [main, develop, "sprint/**"]
  pull_request:
    branches: [main, develop]

env:
  # Sprint0：仅开启共享内核 + identity领域模块测试
  SPRINT_MODULES: "co-shared-kernel,co-identity/co-identity-domain"

jobs:
  backend:
    name: 后端构建与验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # 阶段1: 编译 (模块依赖不成环由 Maven 保证)
      - name: 编译
        run: mvn -B -f backend/pom.xml clean compile -pl ${SPRINT_MODULES} -am

      # 阶段2: 单元测试 (领域层 + 应用层，毫秒级，无外部依赖)
      - name: 单元测试
        run: mvn -B -f backend/pom.xml test -pl ${SPRINT_MODULES} -am

      # 阶段3: 架构适应度函数 (ArchUnit: FF-1~FF-6)
      - name: 架构约束检查
        run: mvn -B -f backend/pom.xml test -pl co-bootstrap -am -Dtest=ArchitectureTest -DfailIfNoTests=false

      # 阶段4: 领域层覆盖率门禁 (低于阈值直接失败)
      - name: 覆盖率门禁
        run: mvn -B -f backend/pom.xml verify -DskipITs -Djacoco.skip=false -pl ${SPRINT_MODULES} -am

      # 阶段5: 集成测试 (Testcontainers拉起真实MySQL + Redis)
      - name: 集成测试
        continue-on-error: true
        run: mvn -B -f backend/pom.xml verify -Dsurefire.skip=true

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: '**/target/*-reports/*.xml'

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck

      - name: 构建
        working-directory: frontend
        run: npm run build

  images:
    name: 容器镜像构建
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        run: docker build -f deploy/backend/Dockerfile -t campus-overflow-backend:${{ github.sha }} .
      - name: 构建前端镜像
        run: docker build -f deploy/frontend/Dockerfile -t campus-overflow-web:${{ github.sha }} .
